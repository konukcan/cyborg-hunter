<!DOCTYPE html>
<!--
  PERF NOTE. This page is the default subject of
  tools/investigate/capture-perf-baseline.mjs, so its DOM is part of every
  measurement taken through it. Commit 4d6856c (T3.9) added five elements and a
  900 px filler, which means the absolute numbers recorded by T3 Tasks 0, 4 and
  8 describe the PRE-4d6856c page and are not comparable to a fresh run against
  this one. The T3.9 perf gate sidesteps that by measuring both arms against the
  f38a59f copy of this file (see tools/investigate/perf-pair.mjs); any later
  re-baseline should either do the same or state that it re-based.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Replay E2E demo (standalone, no jsPsych)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    #experiment { max-width: 640px; }
    .card { width: 120px; height: 168px; border: 2px solid #333; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 42px; margin: 8px; background: #fff; }
    .card.flipped { background: #1976d2; color: #fff; }
    #feedback { min-height: 28px; font-weight: 600; }
    input, button { font-size: 16px; padding: 6px 10px; margin: 6px 0; }
    #scrollbox { height: 90px; overflow: auto; border: 1px solid #999; padding: 4px; }
    #scrollbox .line { height: 22px; }
    #tail { height: 900px; }
  </style>
</head>
<body>
  <div id="experiment">
    <h1 id="title">Which card wins?</h1>
    <div id="cards">
      <div class="card" id="card-a">7♠</div>
      <div class="card" id="card-b">K♥</div>
    </div>
    <div id="feedback"></div>
    <label>Your answer: <input type="text" id="answer" autocomplete="off"></label><br>
    <label><input type="checkbox" id="confident"> I am confident</label><br>
    <label>Secret (redaction pin): <input type="password" id="secret"></label><br>
    <button id="next">Next</button>

    <!-- Privacy-floor and seed surfaces, added for the T3 finish-line capture
         (tests/browser/replay/capture-fork-smoke.mjs). They sit AFTER #answer
         so the perf harness's focus selector still lands on #answer, which is
         the only ordinary text field. -->
    <div data-ch-redact>
      <label>Redacted note: <input type="text" id="redacted-note" autocomplete="off"></label>
    </div>
    <!-- Empty-valued exclusion attribute: the Chromium-only oldValue:"" path
         (task-3-review Playwright item 1). -->
    <label>Excluded note: <input type="text" id="excluded-note" data-record-exclude autocomplete="off"></label><br>
    <label>Suit:
      <select id="suit">
        <option value="s">Spades</option>
        <option value="h">Hearts</option>
        <option value="d">Diamonds</option>
      </select>
    </label><br>
    <div id="scrollbox">
      <div class="line">line 1</div><div class="line">line 2</div>
      <div class="line">line 3</div><div class="line">line 4</div>
      <div class="line">line 5</div><div class="line">line 6</div>
      <div class="line">line 7</div><div class="line">line 8</div>
      <div class="line">line 9</div><div class="line">line 10</div>
    </div>
    <!-- Tall filler so the WINDOW can scroll (initial_state.scroll seed). -->
    <div id="tail"></div>
  </div>

  <!-- Library under test: built dist artifacts, exactly what studies load -->
  <script src="../../../dist/cyborg-hunter.min.js"></script>
  <script src="../../../dist/cyborg-hunter-replay.js"></script>
  <script src="../../../dist/extension-guard-friction.js"></script>
  <script src="../../../dist/extension-guard-honeypot.js"></script>

  <script>
    // Standalone wiring (no jsPsych): the exact path a custom experiment
    // would use. Driven from run-replay-tests.mjs via window.CH_E2E.
    window.CH_E2E = (function () {
      var monitor = null;
      var rec = null;
      var frictionToken = null;

      return {
        // `opts` is merged into the recorder config. Callers that pass nothing
        // get exactly the configuration this page has always used, so the
        // suites written before the v2 rewrite drive an unchanged session.
        start: function (opts) {
          monitor = window.CyborgHunter.init({
            participantId: 'E2E-P1',
            preset: 'standard',
            experimentContainer: '#experiment'
          });
          monitor.startSession();

          // Replay attaches BEFORE friction starts — same ordering the
          // jsPsych path guarantees (extensions initialize before friction's
          // entry-trial click) — so violation starts are never missed. The
          // library also synthesizes an in-progress violation at subscribe
          // time as a belt-and-braces for the reverse order.
          var cfg = {
            participantId: 'E2E-P1',
            tier: 'dom',
            autoSave: { mode: 'none' },
            root: document.body
          };
          for (var k in (opts || {})) {
            if (Object.prototype.hasOwnProperty.call(opts, k)) cfg[k] = opts[k];
          }
          rec = window.CyborgHunterReplay.attach(cfg);
          rec.startSession();

          // Guards: friction in observe-only mode (no fullscreen needed in
          // headless), honeypot injects bait surfaces that the replay's DOM
          // serializer must strip.
          frictionToken = window.GuardFriction.start({ observeOnly: true });
          window.GuardHoneypot.init({ friction: window.GuardFriction });

          monitor.startTrial({ trialId: 'trial-1' });
          rec.startTrial({ trialId: 'trial-1', plugin: 'ch:standalone-demo' });
        },

        // Simulates the experiment reacting to the participant: feedback
        // text (characterData/childList mutations) + a class flip
        // (attribute mutation).
        respond: function () {
          document.getElementById('feedback').textContent = 'Correct!';
          document.getElementById('card-b').classList.add('flipped');
        },

        // `id` defaults to 'trial-2' so the pre-v2 callers are unchanged; the
        // finish-line capture passes ids to drive a multi-segment session.
        nextTrial: function (id) {
          var tid = id || 'trial-2';
          rec.endTrial();
          monitor.endTrial();
          monitor.startTrial({ trialId: tid });
          rec.startTrial({ trialId: tid, plugin: 'ch:standalone-demo' });
          document.getElementById('title').textContent = 'Round two: which card wins?';
          document.getElementById('feedback').textContent = '';
          document.getElementById('answer').value = '';
        },

        // A DOM edit that is neither a keyframe nor a wipe: the patches a
        // continuation segment is made of.
        mutate: function (n) {
          var fb = document.getElementById('feedback');
          fb.textContent = 'round ' + n + ' scored';
          var row = document.createElement('div');
          row.className = 'note';
          row.id = 'note-' + n;
          row.textContent = 'note ' + n;
          document.getElementById('experiment').appendChild(row);
          var prev = document.getElementById('note-' + (n - 1));
          if (prev) prev.parentNode.removeChild(prev);
          document.getElementById('card-a').setAttribute('data-round', String(n));
        },

        finish: function () {
          rec.endTrial();
          monitor.endTrial();
          rec.stopSession('finished');
          if (frictionToken != null) window.GuardFriction.stop(frictionToken);
          var chReport = monitor.getSessionReport();
          var recording = rec.getRecording({ chSessionReport: chReport });
          monitor.destroy();
          return recording;
        }
      };
    })();
  </script>
</body>
</html>
