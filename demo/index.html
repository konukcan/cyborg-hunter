<!-- demo/index.html
     Static shell for the live-demo page. The tour engine (demo.js), tutorial
     copy (steps.js), and generated signal-manifest.json populate #card and
     the instrument column's two cards (#rail / [data-role="rail"] and
     [data-role="live-pane"]) at runtime — this file only lays out the
     topbar, two-column grid, and script load order.

     [data-role="pane-slot"] (walkthrough item 5): a PERMANENT empty
     promotion target, sibling of #card inside .main-col — never an ad-hoc
     node created during step render, so promotion/demotion can never race
     #card's innerHTML rebuild. It lives inside .main-col (not as a third
     .cols child) so it stays in the main column's grid cell in both the
     2-col and ≤820px single-column layouts; demo.js reparents the live pane
     ([data-role="live-pane"]) in here on step 10 (guard-debrief) and back
     out on leaving. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyborg-hunter — live demo</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<div class="topbar">
  <span class="brand">cyborg-hunter · live demo</span>
  <span class="pid" id="pid"></span>
  <span class="act" id="progress"></span>
  <span class="rec" id="rec" hidden><span class="dot"></span>REC replay</span>
</div>

<div class="cols">
  <div class="main-col">
    <main id="card"></main>
    <div class="pane-slot" data-role="pane-slot"></div>
  </div>
  <aside class="instrument" aria-label="Demo instrument column">
    <div class="card" id="rail" data-role="rail"></div>
    <div class="card" data-role="live-pane"></div>
  </aside>
</div>

<div id="smallmode" hidden></div>

<script src="./dist/cyborg-hunter.min.js"></script>
<script src="./dist/extension-cyborg-hunter.js"></script>
<script src="./dist/extension-guard-friction.js"></script>
<script src="./dist/extension-guard-honeypot.js"></script>
<script src="./dist/cyborg-hunter-replay.js"></script>
<script type="module" src="./demo.js"></script>
</body>
</html>
