<!-- demo/index.html
     Static shell for the live-demo page. The tour engine (demo.js), tutorial
     copy (steps.js), and generated signal-manifest.json populate #card and
     #rail at runtime — this file only lays out the topbar, two-column grid,
     and script load order. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyborg-hunter — live demo</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<div class="topbar">
  <span class="brand">cyborg-hunter · live demo</span>
  <span class="pid" id="pid"></span>
  <span class="act" id="progress"></span>
  <span class="rec" id="rec" hidden><span class="dot"></span>REC replay</span>
</div>

<div class="cols">
  <main id="card"></main>
  <aside id="rail" aria-label="Tracked signals"></aside>
</div>

<div id="smallmode" hidden></div>

<script src="./dist/cyborg-hunter.min.js"></script>
<script src="./dist/extension-guard-friction.js"></script>
<script src="./dist/extension-guard-honeypot.js"></script>
<script src="./dist/cyborg-hunter-replay.js"></script>
<script type="module" src="./demo.js"></script>
</body>
</html>
